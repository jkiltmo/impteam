<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Company Creation Request</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <style>
    /* ---------- Shared design system (matches Sign tool) ---------- */
    body {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      font-family: Arial, system-ui, -apple-system, "Segoe UI", Roboto;
      background: #1789e0;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .wrap, .section, section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
      box-sizing: border-box;
    }

    h1 { margin: 0 0 8px 0; font-size: 1.25rem; color: #fff; }
    h2 { margin: 16px 0 8px 0; font-size: 1.05rem; color: #fff; }
    p { margin: 0 0 10px 0; line-height: 1.45; }

    label { display: block; margin-top: 12px; font-weight: 600; color: #f7fbff; }

    input[type="text"], input[type="file"], select, textarea, .input-area {
      width: 100%;
      padding: 8px;
      margin-top: 6px;
      box-sizing: border-box;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid rgba(0,0,0,0.08);
      background: #ffffff;
      color: #111;
    }

    button, .button {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid rgba(0,0,0,0.12);
      background: #f3f6fb;
      color: #111;
      text-decoration: none;
      text-align: center;
    }
    button:hover, .button:hover { background: #e7ecf5; }
    button:disabled, button[disabled], .button[disabled] { opacity: 0.6; cursor: not-allowed; }

    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }

    .small, .hint { font-size: 0.9rem; color: #eaf6ff; margin-top: 8px; line-height: 1.45; }
    .warn { color: #ffd2d2; }

    #status { margin-top: 10px; font-size: 0.9rem; color: #eaf6ff; white-space: pre-wrap; line-height: 1.45; }
    .error { color: #ffd2d2; }

    /* Two-column layout for the company fields on wider screens */
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
    .fields label { margin-top: 12px; }
    @media (max-width: 640px) { .fields { grid-template-columns: 1fr; } }

    /* Internal admins grid */
    .adminHead, .adminRow {
      display: grid;
      grid-template-columns: 1fr 1fr 1.4fr 34px;
      gap: 8px;
      align-items: center;
    }
    .adminHead { margin-top: 10px; font-weight: 600; color: #f7fbff; font-size: 0.9rem; }
    .adminRow { margin-top: 8px; }
    .adminRow input { margin-top: 0; }
    .removeAdmin { margin-top: 0; padding: 6px 0; line-height: 1; font-size: 16px; }
    @media (max-width: 640px) {
      .adminHead { display: none; }
      .adminRow { grid-template-columns: 1fr 1fr; }
      .adminRow .ae { grid-column: 1 / -1; }
      .adminRow .removeAdmin { grid-column: 1 / -1; }
    }

    /* Top banner navigation */
    .top-banner {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 9999;
      background: var(--card-bg, #ffffff);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      padding: 8px 0;
    }
    .top-nav {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      gap: 18px;
      padding: 6px 16px;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
    }
    .top-nav .nav-link {
      padding: 8px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      color: var(--text-color, #111);
      opacity: 0.9;
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .top-nav .nav-link.active {
      background: var(--accent, #0b72ff);
      color: #fff;
      box-shadow: 0 4px 14px rgba(11,114,255,0.18);
      transform: translateY(-1px);
    }
    .top-nav .nav-link:hover { opacity: 1; transform: translateY(-1px); }

    @media (max-width: 900px) {
      .top-nav { flex-wrap: wrap; gap: 10px; padding: 8px; }
      .top-nav .nav-link { padding: 8px 12px; }
    }
    @media (max-width: 700px) {
      .top-nav { flex-wrap: wrap; justify-content: center; }
    }
  </style>

  <script src="https://unpkg.com/pizzip@3.1.6/dist/pizzip.min.js"></script>

  <script>
    // Mark the active nav link based on the current filename (index counts as home)
    (function () {
      try {
        const links = document.querySelectorAll('.top-banner .nav-link');
        const path = location.pathname.split('/').pop() || 'index.html';
        links.forEach(function (a) {
          if (a.getAttribute('href') === path) {
            a.classList.add('active');
            a.setAttribute('aria-current', 'page');
          }
        });
      } catch (e) { console.warn(e); }
    })();
  </script>

  <div class="wrap">
    <h1>Company Creation Request</h1>
    <p class="hint">Fill in the company details and internal admins, then click <strong>Download</strong> to get the completed Excel request form.</p>

    <div class="fields">
      <div>
        <label for="companyId">Company ID</label>
        <input id="companyId" type="text" placeholder="Company ID" />
      </div>
      <div>
        <label for="companyName">Company Name</label>
        <input id="companyName" type="text" placeholder="Company Name" />
      </div>
      <div>
        <label for="street">Street</label>
        <input id="street" type="text" placeholder="Street address" />
      </div>
      <div>
        <label for="country">Country</label>
        <input id="country" type="text" placeholder="Country" />
      </div>
      <div>
        <label for="region">Region/State</label>
        <input id="region" type="text" placeholder="Region or State" />
      </div>
      <div>
        <label for="zip">Zip Code</label>
        <input id="zip" type="text" placeholder="Zip / Postal code" />
      </div>
      <div>
        <label for="city">City</label>
        <input id="city" type="text" placeholder="City" />
      </div>
      <div>
        <label for="attention">Attention Line</label>
        <input id="attention" type="text" placeholder="Attention line" />
      </div>
    </div>

    <h2>Internal Admins</h2>
    <div class="adminHead">
      <div>First Name</div>
      <div>Last Name</div>
      <div>Email</div>
      <div></div>
    </div>
    <div id="adminRows"></div>
    <div class="row">
      <button id="addAdminBtn" type="button">+ Add admin</button>
    </div>

    <div class="row">
      <button id="downloadBtn">Download completed Excel</button>
    </div>

    <div id="status"></div>
  </div>

  <!-- One admin row, cloned for each admin -->
  <template id="adminTemplate">
    <div class="adminRow">
      <input class="af" type="text" placeholder="First name" autocomplete="off" />
      <input class="al" type="text" placeholder="Last name" autocomplete="off" />
      <input class="ae" type="text" placeholder="name@example.com" autocomplete="off" />
      <button type="button" class="removeAdmin" title="Remove">&times;</button>
    </div>
  </template>

    function b64ToUint8(b64){
      var bin = atob(b64);
      var arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    }
    function xmlEscape(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function sanitizeFilename(s){ return String(s||'').replace(/[\/\\?%*:|"<>]/g,'_').replace(/\s+/g,' ').trim().slice(0,120); }
    function val(id){ return (document.getElementById(id).value || '').trim(); }
    function setStatus(msg, warn){
      var el = document.getElementById('status');
      el.textContent = msg || '';
      el.className = warn ? 'error' : '';
    }

    /* Build one worksheet cell. Empty stays an empty (styled) cell; a value goes in as text. */
    function cell(ref, styleAttr, value){
      if (value === undefined || value === null || value === '') return '<c r="' + ref + '"' + styleAttr + '/>';
      return '<c r="' + ref + '"' + styleAttr + ' t="inlineStr"><is><t xml:space="preserve">' + xmlEscape(value) + '</t></is></c>';
    }

    function buildWorkbook(data){
      var zip = new PizZip(b64ToUint8(TEMPLATE_B64));

      /* Sheet 1 - Company Location Form (values go in row 2) */
      var s1 = zip.file('xl/worksheets/sheet1.xml').asText();
      s1 = s1.replace('<c r="A2" s="3"/>', cell('A2', ' s="3"', data.companyId));
      s1 = s1.replace('<c r="B2"/>', cell('B2', '', data.companyName));
      s1 = s1.replace('<c r="C2" s="6"/>', cell('C2', ' s="6"', data.street) + cell('D2', '', data.country));
      s1 = s1.replace('<c r="E2"/>', cell('E2', '', data.region));
      s1 = s1.replace('<c r="F2"/>', cell('F2', '', data.zip));
      s1 = s1.replace('<c r="G2"/>', cell('G2', '', data.city));
      s1 = s1.replace('<c r="H2" s="6"/>', cell('H2', ' s="6"', data.attention));
      zip.file('xl/worksheets/sheet1.xml', s1);

      /* Sheet 2 - Internal Admin Form (Table1, data rows start at row 3) */
      var s2 = zip.file('xl/worksheets/sheet2.xml').asText();
      s2 = s2.replace('<dimension ref="A1:C8"/>', '<dimension ref="A1:C' + Math.max(8, 2 + data.admins.length) + '"/>');
      var startIdx = s2.indexOf('<row r="3"');
      var endIdx = s2.indexOf('</sheetData>');
      if (startIdx < 0) startIdx = endIdx;
      var rowsXml = data.admins.map(function(a, i){
        var r = 3 + i;
        return '<row r="' + r + '" spans="1:3" x14ac:dyDescent="0.45">'
          + cell('A' + r, ' s="8"', a.first)
          + cell('B' + r, ' s="8"', a.last)
          + cell('C' + r, ' s="8"', a.email)
          + '</row>';
      }).join('');
      s2 = s2.slice(0, startIdx) + rowsXml + s2.slice(endIdx);
      zip.file('xl/worksheets/sheet2.xml', s2);

      /* If more than the template's 16 rows, widen the table to fit */
      if (data.admins.length > 16) {
        var lastRow = 2 + data.admins.length;
        var t = zip.file('xl/tables/table1.xml').asText();
        t = t.split('A2:C18').join('A2:C' + lastRow);
        zip.file('xl/tables/table1.xml', t);
      }

      return zip.generate({ type: 'uint8array' });
    }

    /* ---------- Admin rows (add / remove) ---------- */
    var adminRowsEl = document.getElementById('adminRows');
    var adminTpl = document.getElementById('adminTemplate');

    function addAdmin(){
      var node = adminTpl.content.firstElementChild.cloneNode(true);
      node.querySelector('.removeAdmin').addEventListener('click', function(){ node.remove(); });
      adminRowsEl.appendChild(node);
    }

    function collectAdmins(){
      return Array.prototype.slice.call(adminRowsEl.querySelectorAll('.adminRow')).map(function(r){
        return {
          first: r.querySelector('.af').value.trim(),
          last: r.querySelector('.al').value.trim(),
          email: r.querySelector('.ae').value.trim()
        };
      }).filter(function(a){ return a.first || a.last || a.email; });
    }

    /* ---------- Download ---------- */
    function run(){
      try {
        setStatus('');
        var data = {
          companyId: val('companyId'),
          companyName: val('companyName'),
          street: val('street'),
          country: val('country'),
          region: val('region'),
          zip: val('zip'),
          city: val('city'),
          attention: val('attention'),
          admins: collectAdmins()
        };

        if (!data.companyName && !data.companyId) {
          setStatus('Please enter at least a Company Name or Company ID.', true);
          return;
        }

        var uint8 = buildWorkbook(data);
        var blob = new Blob([uint8], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        var base = sanitizeFilename(data.companyName || data.companyId) || 'Company';
        saveAs(blob, 'Company Creation Request - ' + base + '.xlsx');
        setStatus('Done - downloaded the completed request for "' + (data.companyName || data.companyId) + '".');
      } catch (e) {
        console.error(e);
        setStatus('Error: ' + (e && e.message ? e.message : e), true);
      }
    }

    document.getElementById('addAdminBtn').addEventListener('click', addAdmin);
    document.getElementById('downloadBtn').addEventListener('click', run);
    // Start with three admin rows
    addAdmin(); addAdmin(); addAdmin();
  </script>
</body>
