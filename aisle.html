<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Aisle Sign Tool</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />


  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.6/dist/pizzip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    .progressWrap { margin-top: 16px; background: rgba(255,255,255,0.06); border-radius: 8px; padding: 10px; }
    .progressBar { width: 100%; height: 16px; background: rgba(0,0,0,0.08); border-radius: 8px; overflow: hidden; position: relative; }
    .progressFill { height: 100%; width: 0%; background: linear-gradient(90deg,#00ffb3,#00aaff); border-radius: 8px; transition: width 300ms ease; }
    .progressLabel { margin-top: 8px; font-size: 13px; color: #eaf6ff; display: block; }
    .signBlock { border-top: 1px solid rgba(255,255,255,0.18); margin-top: 16px; padding-top: 4px; }
    .signBlock:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
    .signHead { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .signHead .signTitle { font-weight: 600; color: #fff; }
    .removeBtn { margin-top: 0; padding: 6px 10px; font-size: 13px; }
  </style>
  <link rel="stylesheet" href="site.css" />
  <script src="nav.js" defer></script>
</head>
<body>



  <div class="wrap">
    <h1>Aisle Sign Tool</h1>
    <p class="hint">
      Create one or more aisle signs. Choose a template, type the aisle name, and list your details one per line.
      Click <strong>Generate Signs</strong> to download them.
    </p>

    <div id="signs"></div>

    <div class="row">
      <button id="addBtn" type="button">+ Add another sign</button>
    </div>

    <div class="row">
      <button id="runBtn">Generate Signs</button>
    </div>

    <div class="progressWrap" aria-hidden="false">
      <div class="progressBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progressFill" class="progressFill"></div>
      </div>
      <div id="progressLabel" class="progressLabel">Idle</div>
    </div>

    <div id="status" class="small"></div>
  </div>

  <!-- One sign block, cloned for each sign -->
  <template id="signTemplate">
    <div class="signBlock">
      <div class="signHead">
        <strong class="signTitle">Sign</strong>
        <button type="button" class="removeBtn">Remove</button>
      </div>

      <label>Template</label>
      <select class="tpl">
        <option value="beakers">Beakers</option>
        <option value="hands">Hands</option>
      </select>

      <label>Aisle Name</label>
      <input class="aisle" type="text" placeholder="e.g. Row 1" />

      <label>Items (one per line, max 17 lines)</label>
      <textarea class="items" placeholder="Bottles&#10;Flasks&#10;PPE"></textarea>
    </div>
  </template>

  <script>
    /* ---------- Template files (upload these next to this page) ---------- */
    const TEMPLATES = {
      beakers: 'aisle-beakers.docx',
      hands: 'aisle-hands.docx'
    };
    const tplCache = {};

    /* ---------- Utilities ---------- */
    function xmlEscape(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function sanitizeFilename(s){ return String(s||'').replace(/[\/\\?%*:|"<>]/g,'_').replace(/\s+/g,' ').trim().slice(0,120); }

    function setStatus(msg, warn){
      var el = document.getElementById('status');
      el.textContent = msg || '';
      el.className = warn ? 'warn' : 'small';
    }
    function updateProgress(percent, label){
      var fill = document.getElementById('progressFill');
      var lbl = document.getElementById('progressLabel');
      percent = Math.max(0, Math.min(100, Math.round(percent)));
      fill.style.width = percent + '%';
      fill.parentElement.setAttribute('aria-valuenow', percent);
      lbl.textContent = (label || (percent + '%'));
    }

    /* A centered item line, styled to match the template's heading (orange, smaller) */
    function itemParagraph(text){
      return '<w:p><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/><w:jc w:val="center"/></w:pPr>'
           + '<w:r><w:rPr><w:rFonts w:ascii="Segoe UI Semibold" w:hAnsi="Segoe UI Semibold" w:cs="Segoe UI Semibold"/>'
           + '<w:b/><w:bCs/><w:i w:val="0"/><w:iCs w:val="0"/><w:color w:val="000000"/><w:sz w:val="44"/><w:szCs w:val="44"/></w:rPr>'
           + '<w:t xml:space="preserve">' + xmlEscape(text) + '</w:t></w:r></w:p>';
    }

    /* The item lines, placed in a borderless full-height cell that vertically centers them
       in the space beneath the heading (the heading itself stays where it is). */
    function itemsTable(items){
      var noBorder = '<w:tblBorders>'
        + '<w:top w:val="none" w:sz="0" w:space="0" w:color="auto"/>'
        + '<w:left w:val="none" w:sz="0" w:space="0" w:color="auto"/>'
        + '<w:bottom w:val="none" w:sz="0" w:space="0" w:color="auto"/>'
        + '<w:right w:val="none" w:sz="0" w:space="0" w:color="auto"/>'
        + '<w:insideH w:val="none" w:sz="0" w:space="0" w:color="auto"/>'
        + '<w:insideV w:val="none" w:sz="0" w:space="0" w:color="auto"/>'
        + '</w:tblBorders>';
      return '<w:tbl>'
        + '<w:tblPr><w:tblW w:w="10800" w:type="dxa"/><w:jc w:val="center"/>' + noBorder
        + '<w:tblLook w:val="0000" w:firstRow="0" w:lastRow="0" w:firstColumn="0" w:lastColumn="0" w:noHBand="1" w:noVBand="1"/></w:tblPr>'
        + '<w:tblGrid><w:gridCol w:w="10800"/></w:tblGrid>'
        + '<w:tr><w:trPr><w:trHeight w:val="9000" w:hRule="atLeast"/></w:trPr>'
        + '<w:tc><w:tcPr><w:tcW w:w="10800" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>'
        + items.map(itemParagraph).join('')
        + '</w:tc></w:tr></w:tbl>';
    }

    async function loadTemplate(key){
      if (tplCache[key]) return tplCache[key];
      var url = TEMPLATES[key];
      var res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('Could not load template "' + url + '" (HTTP ' + res.status + '). Make sure it is uploaded in the same folder as this page.');
      var ct = (res.headers.get('content-type') || '').toLowerCase();
      if (ct.includes('text/html')) throw new Error('Template "' + url + '" was not found (got an HTML page instead). Check the file name and that it is uploaded next to this page.');
      var buf = await res.arrayBuffer();
      tplCache[key] = buf;
      return buf;
    }

    /* Fill one template: set the aisle title and add the centered item lines */
    function buildDocx(tplBuf, aisle, items){
      var zip = new PizZip(tplBuf);
      var path = 'word/document.xml';
      var xml = zip.file(path).asText();

      // 1) remove the opening "<<"
      xml = xml.replace('<w:t>&lt;&lt;</w:t>', '<w:t></w:t>');
      // 2) replace "Aisle " with the entered name
      xml = xml.replace('<w:t xml:space="preserve">Aisle </w:t>', '<w:t xml:space="preserve">' + xmlEscape(aisle) + '</w:t>');
      // 3) remove the closing ">>" and insert the item lines right after the title paragraph
      var itemsXml = items.length ? itemsTable(items) : '';
      xml = xml.replace('&gt;&gt;</w:t></w:r></w:p>', '</w:t></w:r></w:p>' + itemsXml);

      zip.file(path, xml);
      return zip.generate({ type: 'uint8array' });
    }

    /* ---------- Sign blocks (add / remove / number) ---------- */
    var signsEl = document.getElementById('signs');
    var signTpl = document.getElementById('signTemplate');

    function renumber(){
      var blocks = Array.prototype.slice.call(signsEl.querySelectorAll('.signBlock'));
      var showRemove = blocks.length > 1;
      blocks.forEach(function(b, i){
        b.querySelector('.signTitle').textContent = 'Sign ' + (i + 1);
        b.querySelector('.removeBtn').style.display = showRemove ? '' : 'none';
      });
    }

    function addSign(){
      var node = signTpl.content.firstElementChild.cloneNode(true);
      node.querySelector('.removeBtn').addEventListener('click', function(){
        node.remove();
        renumber();
      });
      signsEl.appendChild(node);
      renumber();
    }

    function collect(){
      return Array.prototype.slice.call(signsEl.querySelectorAll('.signBlock')).map(function(b){
        return {
          tpl: b.querySelector('.tpl').value,
          aisle: (b.querySelector('.aisle').value || '').trim(),
          items: (b.querySelector('.items').value || '').split(/\r?\n/).map(function(s){ return s.trim(); }).filter(Boolean)
        };
      });
    }

    /* ---------- Generate ---------- */
    async function run(){
      try {
        setStatus('');
        updateProgress(3, 'Starting…');

        var blocks = collect();
        if (blocks.length === 0){ setStatus('Add at least one sign.', true); updateProgress(0, 'Nothing to do'); return; }
        for (var i = 0; i < blocks.length; i++){
          if (!blocks[i].aisle){ setStatus('Sign ' + (i + 1) + ': please enter an aisle name.', true); updateProgress(0, 'Missing aisle name'); return; }
        }

        updateProgress(10, 'Loading templates…');
        var needed = blocks.map(function(b){ return b.tpl; }).filter(function(v, idx, a){ return a.indexOf(v) === idx; });
        for (var n = 0; n < needed.length; n++){ await loadTemplate(needed[n]); }

        var total = blocks.length;
        var outZip = (total > 1) ? new JSZip() : null;
        var usedNames = {};
        var singleBlob = null, singleName = '';

        for (var b = 0; b < total; b++){
          var block = blocks[b];
          updateProgress(20 + Math.round((b / total) * 70), 'Generating: ' + block.aisle);

          var buf = await loadTemplate(block.tpl);
          var uint8 = buildDocx(buf, block.aisle, block.items);

          var base = sanitizeFilename(block.aisle) || ('Aisle ' + (b + 1));
          var fn = base + '.docx';
          var dup = 2;
          while (usedNames[fn]) { fn = base + ' (' + (dup++) + ').docx'; }
          usedNames[fn] = true;

          if (outZip){
            outZip.file(fn, uint8);
          } else {
            singleBlob = new Blob([uint8], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
            singleName = fn;
          }
          await new Promise(function(r){ setTimeout(r, 30); });
        }

        if (outZip){
          updateProgress(94, 'Packaging ZIP…');
          var zipBlob = await outZip.generateAsync({ type: 'blob' });
          saveAs(zipBlob, 'Aisle Signs.zip');
          updateProgress(100, 'Done - ZIP downloaded');
          setStatus('Done - ' + total + ' signs downloaded as a ZIP.');
        } else {
          saveAs(singleBlob, singleName);
          updateProgress(100, 'Done - file downloaded');
          setStatus('Done - 1 sign downloaded.');
        }
      } catch (e){
        console.error(e);
        setStatus('Error: ' + (e && e.message ? e.message : e), true);
        updateProgress(0, 'Error');
      }
    }

    document.getElementById('addBtn').addEventListener('click', addSign);
    document.getElementById('runBtn').addEventListener('click', run);
    addSign(); // start with one sign
  </script>
</body>
</html>
